name: 'frank_dbt_project'
version: '1.0.0'
config-version: 2

profile: 'default'

vars:
   wrk_schema: BRONZE
   file_format_csv: SCD2_DB.BRONZE.MY_CSV_FORMAT
   purge_status: FALSE
   stage_name: SCD2_DB.BRONZE.s3_test_stage
   rawhist_db: SCD2_DB

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  frank_dbt_project:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: view